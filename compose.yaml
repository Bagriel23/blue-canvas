name: blue-canvas

x-node-base: &node-base
  image: node:24.6.0-alpine@sha256:d2b1a9d0f18b1fbc7b1c96ebfe7b6d9dfe1e3ab60ed30c37d9f5a5b0d0f18a1c
  working_dir: /workspace
  restart: unless-stopped
  networks:
    - blue-canvas
  volumes:
    - .:/workspace

services:
  mariadb:
    image: mariadb:10.6.28@sha256:92e50059ea0a5965a33ef751970eab37d421b91ebbd01ac909039cffe159e574
    restart: unless-stopped
    networks:
      - blue-canvas
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-blue_canvas}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-blue_canvas_dev}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-blue_canvas_root_dev}
      MARIADB_USER: ${MARIADB_USER:-blue_canvas}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb106-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5m

  api:
    <<: *node-base
    profiles: ["app"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      SETUP_SECRET: ${SETUP_SECRET}
      ASSET_STORAGE_ROOT: /var/lib/blue-canvas/assets
      DATABASE_HOST: mariadb
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MARIADB_DATABASE:-blue_canvas}
      DATABASE_USER: ${MARIADB_USER:-blue_canvas}
      DATABASE_PASSWORD: ${MARIADB_PASSWORD:-blue_canvas_dev}
    command: ["sh", "-c", "npm run start -w @blue-canvas/server"]
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - assets-data:/var/lib/blue-canvas/assets
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mcp:
    <<: *node-base
    profiles: ["app"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      BLUE_CANVAS_API_URL: http://api:3000
      MCP_HOST: 0.0.0.0
      MCP_PORT: 5011
    command: ["sh", "-c", "npm run start -w @blue-canvas/mcp-server"]
    ports:
      - "127.0.0.1:${MCP_PORT:-5011}:5011"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5011/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    <<: *node-base
    profiles: ["app"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_UPSTREAM: http://api:3000
    command:
      ["sh", "-c", "npm run preview -w @blue-canvas/web -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:4173"

networks:
  blue-canvas:

volumes:
  mariadb106-data:
  assets-data:
